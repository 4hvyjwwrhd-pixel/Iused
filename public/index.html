<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iUsed | تسعير الموبايلات</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#161616;font-family:Arial,Tahoma,sans-serif}
header{background:#111;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:980px;margin:auto}
.logo{font-size:30px;font-weight:900}
.logo i{color:#f2b400;font-style:normal}
.sub{font-size:13px;opacity:.7;margin-top:4px}
main{padding:16px}

.tools,.filters{
display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 12px
}

input,select,button,textarea{
font:inherit;border:1px solid #ddd;border-radius:11px;
padding:11px 12px;background:#fff
}

textarea{width:100%;min-height:210px;resize:vertical}
#q{flex:1;min-width:210px}
.filters input{flex:1;min-width:110px}

button{cursor:pointer;font-weight:700}
.gold{background:#f2b400;border-color:#f2b400}
.dark{background:#111;color:#fff;border-color:#111}
.green{background:#198754;color:#fff;border-color:#198754}
.red{background:#b42318;color:#fff;border-color:#b42318}

.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{
background:#fff;border-radius:12px;padding:11px 14px;flex:1;
box-shadow:0 2px 8px #00000008
}

.card{
background:#fff;border-radius:14px;padding:13px;margin:8px 0;
display:flex;align-items:center;gap:12px;
box-shadow:0 2px 8px #00000008
}

.card.sold{opacity:.68}

.n{
width:36px;height:36px;border-radius:50%;
background:#111;color:#fff;display:grid;place-items:center;font-size:12px
}

.info{flex:1;min-width:170px}
.name{font-weight:800;font-size:16px}
.brand{font-size:12px;color:#777;margin-top:4px}

.specs{margin-top:6px;font-size:12px}
.spec{
display:inline-block;background:#f0f0f0;padding:4px 7px;
border-radius:7px;margin-left:4px
}

.type{
display:inline-block;font-size:11px;font-weight:700;
padding:4px 8px;border-radius:20px;margin-top:6px
}
.type.used{background:#eee;color:#333}
.type.new{background:#fff2bd;color:#765900}

.available{
display:inline-block;background:#dff5e7;color:#126b36;
font-size:11px;font-weight:700;padding:4px 8px;
border-radius:20px;margin-top:6px
}

.unavailable{
display:inline-block;background:#fde2e0;color:#a1160a;
font-size:11px;font-weight:700;padding:4px 8px;
border-radius:20px;margin-top:6px
}

.date{
font-size:11px;color:#777;margin-top:7px
}

.price{font-size:18px;font-weight:900;white-space:nowrap}

.actions{
display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end
}

.adminOnly{display:none}
.admin .adminOnly{display:inline-block}

.edit{width:105px;padding:8px}
.full{width:100%;margin-top:7px}

.modal{
display:none;position:fixed;inset:0;background:#0008;
z-index:20;align-items:center;justify-content:center;padding:12px
}
.modal.show{display:flex}

.box{
background:#fff;width:min(430px,96%);padding:20px;
border-radius:16px;max-height:92vh;overflow:auto
}
.box h3{margin-top:0}
.box input,.box select{width:100%;margin-bottom:9px}

.hint{
background:#f6f6f6;padding:10px;border-radius:10px;
font-size:12px;line-height:1.7;margin-bottom:10px
}

.result{
margin-top:10px;padding:10px;border-radius:10px;
background:#f4f5f7;display:none
}

.toast{
position:fixed;bottom:18px;left:50%;
transform:translateX(-50%);background:#111;color:#fff;
padding:10px 15px;border-radius:10px;display:none;
z-index:30;max-width:90%;text-align:center
}

@media(max-width:620px){
.card{align-items:flex-start;flex-wrap:wrap}
.price{font-size:16px}
.actions{width:100%}
.stats{font-size:13px}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<div class="logo">i<i>Used</i></div>
<div class="sub">نظام تسعير الموبايلات</div>
</div>
</header>

<main class="wrap">

<div class="tools">

<input id="q" placeholder="ابحث باسم الموبايل..." oninput="load()">

<select id="brand" onchange="load()">
<option value="">كل الشركات</option>
</select>

<select id="type" onchange="load()">
<option value="">جديد ومستعمل</option>
<option value="used">مستعمل</option>
<option value="new">جديد</option>
</select>

<button class="gold" id="loginBtn" onclick="openLogin()">🔐 المدير</button>

<button class="adminOnly" onclick="openAdd()">＋ إضافة موديل</button>

<button class="adminOnly gold" onclick="openBulk()">📋 إضافة قائمة أسعار</button>

<button class="adminOnly" onclick="logout()">خروج</button>

</div>

<div class="filters">

<input id="storage" placeholder="المساحة" oninput="load()">

<input id="ram" placeholder="الرام" oninput="load()">

<input id="minPrice" type="number" placeholder="السعر من" oninput="load()">

<input id="maxPrice" type="number" placeholder="السعر إلى" oninput="load()">

<button onclick="clearFilters()">مسح البحث</button>

</div>

<div class="stats">
<div class="stat">عدد النتائج: <b id="count">0</b></div>
<div class="stat">الحالة: <b id="status">عرض فقط</b></div>
</div>

<section id="list"></section>

</main>

<!-- LOGIN -->

<div class="modal" id="loginModal">
<div class="box">

<h3>دخول المدير</h3>

<input id="password" type="password" placeholder="الرقم السري">

<button class="dark full" onclick="login()">دخول</button>
<button class="full" onclick="closeModal('loginModal')">إلغاء</button>

</div>
</div>

<!-- ADD ONE -->

<div class="modal" id="addModal">
<div class="box">

<h3>إضافة موديل</h3>

<input id="newBrand" placeholder="الشركة">
<input id="newName" placeholder="اسم الموديل">
<input id="newStorage" placeholder="المساحة - مثال 256">
<input id="newRam" placeholder="الرام - مثال 8">
<input id="newPrice" type="number" placeholder="السعر بالجنيه">

<select id="newType">
<option value="used">مستعمل</option>
<option value="new">جديد</option>
</select>

<button class="dark full" onclick="addModel()">إضافة</button>
<button class="full" onclick="closeModal('addModal')">إلغاء</button>

</div>
</div>

<!-- BULK PRICE LIST -->

<div class="modal" id="bulkModal">
<div class="box">

<h3>📋 إضافة قائمة أسعار</h3>

<div class="hint">
كل جهاز في سطر بالشكل ده:<br>
<b>Samsung | A57 5G | 12 | 256 | 27790</b><br><br>
الترتيب:<br>
الشركة | الموديل | الرام | المساحة | السعر<br><br>
لو الجهاز موجود، السعر القديم هيتحدث تلقائيًا.
</div>

<textarea
id="bulkText"
placeholder="Samsung | A57 5G | 12 | 256 | 27790
Samsung | A17 | 8 | 256 | 16700">
</textarea>

<select id="bulkType">
<option value="new">القائمة أجهزة جديدة</option>
<option value="used">القائمة أجهزة مستعملة</option>
</select>

<button class="dark full" onclick="importBulk()">
حفظ وتحديث قائمة الأسعار
</button>

<div class="result" id="bulkResult"></div>

<button class="full" onclick="closeModal('bulkModal')">إغلاق</button>

</div>
</div>

<div class="toast" id="toast"></div>

<script>

let admin=false;
const $=id=>document.getElementById(id);

const money=n=>
new Intl.NumberFormat("ar-EG").format(n)+" ج.م";

function formatDate(v){

if(!v) return "";

const d=new Date(v.replace(" ","T")+"Z");

if(isNaN(d)) return v;

return new Intl.DateTimeFormat(
"ar-EG",
{
dateStyle:"short",
timeStyle:"short",
timeZone:"Africa/Cairo"
}
).format(d);

}

function toast(s){

$("toast").textContent=s;
$("toast").style.display="block";

setTimeout(
()=> $("toast").style.display="none",
2200
);

}

async function api(url,opt={}){

const r=await fetch(
url,
{
headers:{
"Content-Type":"application/json"
},
...opt
}
);

if(!r.ok){

let e={};

try{
e=await r.json();
}catch{}

throw Error(
e.error||"حدث خطأ"
);

}

return r.json();

}

/* =====================
   LOAD
===================== */

async function loadBrands(){

const bs=await api("/api/brands");

$("brand").innerHTML=
'<option value="">كل الشركات</option>'+
bs.map(
b=>`<option>${b}</option>`
).join("");

}

async function load(){

try{

const params=new URLSearchParams();

const values={
q:$("q").value,
brand:$("brand").value,
type:$("type").value,
storage:$("storage").value,
ram:$("ram").value,
minPrice:$("minPrice").value,
maxPrice:$("maxPrice").value
};

Object.entries(values).forEach(
([k,v])=>{
if(v) params.set(k,v);
}
);

const rows=
await api(
"/api/models?"+
params.toString()
);

$("count").textContent=
rows.length;

$("list").innerHTML=
rows.length
?
rows.map(renderModel).join("")
:
'<div class="empty">لا توجد نتائج</div>';

}catch(e){

$("list").innerHTML=
'<div class="empty">'+
e.message+
'</div>';

}

}

function renderModel(x){

const isUsed=
x.type==="used";

const sold=
isUsed &&
Number(x.available)===0;

return `

<div class="card ${sold ? "sold" : ""}">

<div class="n">
${x.id}
</div>

<div class="info">

<div class="name">
${escapeHtml(x.name)}
</div>

<div class="brand">
${escapeHtml(x.brand)}
</div>

<div class="specs">

${x.storage
? `<span class="spec">💾 ${escapeHtml(x.storage)} GB</span>`
: ""}

${x.ram
? `<span class="spec">RAM ${escapeHtml(x.ram)} GB</span>`
: ""}

</div>

<div>

<span class="type ${x.type}">
${x.type==="new" ? "جديد" : "مستعمل"}
</span>

${isUsed
?
(
sold
?
'<span class="unavailable">غير متوفر</span>'
:
'<span class="available">متوفر</span>'
)
:
""
}

</div>

<div class="date">

${x.type==="new"
?
"آخر تحديث للسعر: "+formatDate(x.updated_at)
:
(
sold
?
"اتباع: "+formatDate(x.sold_at)
:
"آخر تحديث للسعر: "+formatDate(x.updated_at)
)
}

</div>

</div>

<div class="price">
${money(x.price)}
</div>

<div class="actions">

${isUsed && !sold
?
`
<button
class="red"
onclick="markSold(${x.id})">
غير متوفر
</button>
`
:
""
}

${isUsed && sold
?
`
<button
class="green adminOnly"
onclick="restoreModel(${x.id})">
إرجاع متوفر
</button>
`
:
""
}

<input
class="edit adminOnly"
id="p${x.id}"
type="number"
value="${x.price}"
>

<button
class="dark adminOnly"
onclick="save(${x.id})">
حفظ السعر
</button>

<button
class="adminOnly"
onclick="removeModel(${x.id})">
حذف
</button>

</div>

</div>

`;

}

function escapeHtml(v){

return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

/* =====================
   FILTERS
===================== */

function clearFilters(){

[
"q",
"storage",
"ram",
"minPrice",
"maxPrice"
]
.forEach(
id=>$(id).value=""
);

$("brand").value="";
$("type").value="";

load();

}

/* =====================
   ADMIN
===================== */

async function check(){

const m=
await api("/api/me");

admin=m.admin;

document.body.classList.toggle(
"admin",
admin
);

$("loginBtn").style.display=
admin
?
"none"
:
"inline-block";

$("status").textContent=
admin
?
"وضع المدير"
:
"عرض الموظف";

load();

}

function openLogin(){

$("loginModal")
.classList.add("show");

$("password").focus();

}

function closeModal(id){

$(id)
.classList.remove("show");

}

async function login(){

try{

await api(
"/api/login",
{
method:"POST",
body:JSON.stringify({
password:$("password").value
})
}
);

$("password").value="";

closeModal(
"loginModal"
);

toast(
"تم دخول المدير"
);

await check();

}catch(e){

toast(
e.message
);

}

}

async function logout(){

await api(
"/api/logout",
{
method:"POST"
}
);

await check();

toast(
"تم تسجيل الخروج"
);

}

/* =====================
   ADD ONE
===================== */

function openAdd(){

$("addModal")
.classList.add("show");

}

async function addModel(){

try{

await api(
"/api/models",
{
method:"POST",
body:JSON.stringify({

brand:
$("newBrand").value,

name:
$("newName").value,

storage:
$("newStorage").value,

ram:
$("newRam").value,

price:
Number(
$("newPrice").value
),

type:
$("newType").value

})
}
);

[
"newBrand",
"newName",
"newStorage",
"newRam",
"newPrice"
]
.forEach(
id=>$(id).value=""
);

closeModal(
"addModal"
);

await loadBrands();
await load();

toast(
"تم حفظ الجهاز"
);

}catch(e){

toast(
e.message
);

}

}

/* =====================
   BULK LIST
===================== */

function openBulk(){

$("bulkResult").style.display=
"none";

$("bulkModal")
.classList.add("show");

}

function parseBulk(){

const lines=
$("bulkText")
.value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);

const type=
$("bulkType").value;

return lines.map(line=>{

const p=
line
.split("|")
.map(x=>x.trim());

if(p.length<5)
return null;

return {

brand:p[0],

name:p[1],

ram:p[2],

storage:p[3],

price:Number(
String(p[4])
.replace(/,/g,"")
),

type:type

};

}).filter(Boolean);

}

async function importBulk(){

try{

const models=
parseBulk();

if(!models.length){

toast(
"اكتب قائمة الأسعار أولاً"
);

return;

}

if(
!confirm(
`سيتم معالجة ${models.length} جهاز وتحديث السعر القديم عند وجود نفس الجهاز. متابعة؟`
)
)
return;

const result=
await api(
"/api/models/bulk",
{
method:"POST",
body:JSON.stringify({
models
})
}
);

$("bulkResult").style.display=
"block";

$("bulkResult").innerHTML=
`
<b>تم حفظ القائمة ✅</b><br>
تم تحديث: ${result.updated}<br>
تمت إضافة: ${result.added}<br>
تم تجاهل: ${result.skipped}
`;

await loadBrands();
await load();

toast(
"تم تحديث قائمة الأسعار"
);

}catch(e){

toast(
e.message
);

}

}

/* =====================
   PRICE
===================== */

async function save(id){

try{

await api(
"/api/models/"+id,
{
method:"PUT",
body:JSON.stringify({
price:
Number(
$("p"+id).value
)
})
}
);

await load();

toast(
"تم تحديث السعر"
);

}catch(e){

toast(
e.message
);

}

}

/* =====================
   USED SOLD
===================== */

async function markSold(id){

if(
!confirm(
"تأكيد أن الجهاز اتباع وأصبح غير متوفر؟"
)
)
return;

try{

await api(
"/api/models/"+id+"/sold",
{
method:"POST"
}
);

await load();

toast(
"تم تسجيل الجهاز غير متوفر"
);

}catch(e){

toast(
e.message
);

}

}

async function restoreModel(id){

try{

await api(
"/api/models/"+id+"/available",
{
method:"POST"
}
);

await load();

toast(
"تم إرجاع الجهاز متوفر"
);

}catch(e){

toast(
e.message
);

}

}

/* =====================
   DELETE
===================== */

async function removeModel(id){

if(
!confirm(
"حذف هذا الموديل نهائياً؟"
)
)
return;

try{

await api(
"/api/models/"+id,
{
method:"DELETE"
}
);

await loadBrands();
await load();

toast(
"تم الحذف"
);

}catch(e){

toast(
e.message
);

}

}

/* START */

loadBrands()
.then(check);

</script>

</body>
</html>
